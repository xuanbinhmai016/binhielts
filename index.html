                example: 'Despite being heavier, wooden rackets offered superior control.',
                tip: 'Dùng trong Writing Task 2 để phản biện hoặc thừa nhận mặt trái của một vấn đề (Band 7.0+).'
            },
            {
                title: 'Mệnh đề quan hệ rút gọn (Reduced Relative Clauses)',
                formula: 'N + V-ing (chủ động) / N + V-ed/P2 (bị động)',
                example: 'Studies analyzing millions of posts show that falsehoods spread faster.',
                tip: 'Giúp câu văn học thuật súc tích và tăng điểm Grammatical Range.'
            },
            {
                title: 'Dàn ý Writing Task 2: Opinion (Agree/Disagree)',
                formula: 'Intro (Paraphrase + Thesis) -> Body 1 (Reason 1 + Example) -> Body 2 (Reason 2 + Example) -> Conclusion',
                example: 'Topic: Should governments invest more in space exploration or environmental protection?',
                tip: 'Luôn giữ lập trường nhất quán từ mở bài đến kết bài.'
            }
        ];

        const PLACEMENT_QUESTIONS = [
            { q: 'Choose the correct academic word: The rapid ________ of misinformation poses a threat to public trust.', options: ['proliferation', 'proliferate', 'prolific', 'proliferated'], ans: 0 },
            { q: 'Identify the correct grammar: Had the government acted earlier, the species ________ extinct.', options: ['would not become', 'would not have become', 'will not become', 'had not become'], ans: 1 },
            { q: 'Reading comprehension: "Prebunking acts like a vaccine against fake news." What does this imply?', options: ['It cures people after they believe fake news.', 'It prepares people in advance to recognize manipulation.', 'It bans social media platforms.', 'It replaces traditional journalism.'], ans: 1 },
            { q: 'Which sentence is most appropriate for IELTS Writing Task 2?', options: ['A lot of people think cars are bad for the air.', 'It is widely argued that vehicular emissions significantly degrade urban air quality.', 'Cars make pollution very terrible in big cities.', 'I totally agree that cars ruin our environment.'], ans: 1 }
        ];

        // =========================================================================
        // 3. HELPER COMPONENTS & UTILS
        // =========================================================================
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center" />;
        };

        // Quy đổi điểm sang Band Score IELTS tham khảo
        const calculateBandScore = (correct, total) => {
            if (total === 0) return '0.0';
            const ratio = correct / total;
            if (ratio >= 0.95) return '9.0';
            if (ratio >= 0.88) return '8.5';
            if (ratio >= 0.80) return '8.0';
            if (ratio >= 0.72) return '7.5';
            if (ratio >= 0.65) return '7.0';
            if (ratio >= 0.55) return '6.5';
            if (ratio >= 0.45) return '6.0';
            if (ratio >= 0.35) return '5.5';
            if (ratio >= 0.25) return '5.0';
            return '4.5';
        };

        // =========================================================================
        // 4. MAIN APPLICATION COMPONENT
        // =========================================================================
        function App() {
            const [activeTab, setActiveTab] = useState('practice'); // 'dashboard' | 'practice' | 'vocab' | 'grammar' | 'ai'
            const [toastMessage, setToastMessage] = useState(null);

            // State cho Lộ trình & Placement Test
            const [userLevel, setUserLevel] = useState(() => localStorage.getItem('binhielts_level') || 'Band 6.0 (Mục tiêu 7.5)');
            const [showPlacementModal, setShowPlacementModal] = useState(false);
            const [placementAnswers, setPlacementAnswers] = useState({});

            // State cho Từ vựng
            const [learnedVocab, setLearnedVocab] = useState(() => {
                try { return JSON.parse(localStorage.getItem('binhielts_learned_vocab')) || []; }
                catch { return []; }
            });

            // State cho Phòng Luyện Đề (Practice Arena)
            const [selectedSource, setSelectedSource] = useState('All');
            const [selectedSkill, setSelectedSkill] = useState('All');
            const [activeExam, setActiveExam] = useState(null); // Đề đơn lẻ hoặc Full Test object
            const [isFullTestMode, setIsFullTestMode] = useState(false);
            const [fullTestPartIndex, setFullTestPartIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0);
            const [mobileExamPane, setMobileExamPane] = useState('passage'); // 'passage' | 'questions'
            const [examHistory, setExamHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('binhielts_exam_history')) || []; }
                catch { return []; }
            });

            // State cho Audio Listening (Web Speech API)
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);
            const [currentLineIndex, setCurrentLineIndex] = useState(-1);
            const [showTranscript, setShowTranscript] = useState(false);

            // State cho Gia sư AI Gemini
            const [aiSkill, setAiSkill] = useState('Writing Task 2');
            const [aiPromptText, setAiPromptText] = useState('Some people believe that unpaid community service should be a compulsory part of high school programmes. To what extent do you agree or disagree?');
            const [aiUserResponse, setAiUserResponse] = useState('');
            const [aiFeedback, setAiFeedback] = useState(null);
            const [isGrading, setIsGrading] = useState(false);
            const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('binhielts_api_key') || '');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // Lưu trạng thái từ vựng
            useEffect(() => {
                localStorage.setItem('binhielts_learned_vocab', JSON.stringify(learnedVocab));
            }, [learnedVocab]);

            // Lưu lịch sử thi
            useEffect(() => {
                localStorage.setItem('binhielts_exam_history', JSON.stringify(examHistory));
            }, [examHistory]);

            // Đồng hồ đếm ngược khi làm bài
            useEffect(() => {
                if (!activeExam || isSubmitted || timeLeft <= 0) return;
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitExam();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [activeExam, isSubmitted, timeLeft]);

            // Dừng đọc audio khi thoát đề
            useEffect(() => {
                return () => {
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                };
            }, [activeExam]);

            // Phát âm từ vựng US/UK
            const speakWord = (text, accent = 'en-US') => {
                if (!window.speechSynthesis) {
                    showToast('Trình duyệt không hỗ trợ phát âm.');
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = accent;
                utterance.rate = 0.92;
                window.speechSynthesis.speak(utterance);
            };

            // Phát hội thoại Listening phân vai giọng Nam / Nữ
            const togglePlayListeningAudio = (script) => {
                if (!window.speechSynthesis) {
                    showToast('Trình duyệt không hỗ trợ Web Speech API.');
                    return;
                }
                if (isPlayingAudio) {
                    window.speechSynthesis.cancel();
                    setIsPlayingAudio(false);
                    setCurrentLineIndex(-1);
                    return;
                }

                setIsPlayingAudio(true);
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google UK English Female') || v.name.includes('Zira'))) || voices.find(v => v.lang.includes('en-GB'));
                const maleVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('Google UK English Male') || v.name.includes('David'))) || voices.find(v => v.lang.includes('en-US'));

                let idx = 0;
                const speakNextLine = () => {
                    if (idx >= script.length) {
                        setIsPlayingAudio(false);
                        setCurrentLineIndex(-1);
                        return;
                    }
                    setCurrentLineIndex(idx);
                    const line = script[idx];
                    const utterance = new SpeechSynthesisUtterance(line.text);
                    utterance.lang = 'en-GB';
                    utterance.rate = 0.95;
                    if (line.gender === 'female' && femaleVoice) {
                        utterance.voice = femaleVoice;
                        utterance.pitch = 1.08;
                    } else if (line.gender === 'male' && maleVoice) {
                        utterance.voice = maleVoice;
                        utterance.pitch = 0.92;
                    }
                    utterance.onend = () => {
                        idx++;
                        speakNextLine();
                    };
                    utterance.onerror = () => {
                        setIsPlayingAudio(false);
                        setCurrentLineIndex(-1);
                    };
                    window.speechSynthesis.speak(utterance);
                };
                speakNextLine();
            };

            // Bắt đầu làm 1 Part lẻ
            const startSinglePart = (exam) => {
                window.speechSynthesis?.cancel();
                setIsPlayingAudio(false);
                setCurrentLineIndex(-1);
                setShowTranscript(false);
                setIsFullTestMode(false);
                setFullTestPartIndex(0);
                setActiveExam({
                    title: `${exam.source} • ${exam.testName}`,
                    skill: exam.skill,
                    parts: [exam]
                });
                setUserAnswers({});
                setIsSubmitted(false);
                setTimeLeft(exam.durationMinutes * 60);
                setMobileExamPane('passage');
            };

            // Bắt đầu làm Full Test (Ghép 3 Passages Reading hoặc 2 Sections Listening)
            const startFullTest = (skillType) => {
                window.speechSynthesis?.cancel();
                setIsPlayingAudio(false);
                setCurrentLineIndex(-1);
                setShowTranscript(false);
                const selectedParts = EXAM_DATABASE.filter(e => e.skill === skillType).slice(0, skillType === 'Reading' ? 3 : 2);
                setIsFullTestMode(true);
                setFullTestPartIndex(0);
                setActiveExam({
                    title: `Full Mock Test - IELTS Academic ${skillType}`,
                    skill: skillType,
                    parts: selectedParts
                });
                setUserAnswers({});
                setIsSubmitted(false);
                setTimeLeft((skillType === 'Reading' ? 60 : 30) * 60);
                setMobileExamPane('passage');
            };

            // Nộp bài & Chấm điểm tự động
            const handleSubmitExam = () => {
                window.speechSynthesis?.cancel();
                setIsPlayingAudio(false);
                setIsSubmitted(true);
                setShowTranscript(true);

                let totalQ = 0;
                let correctQ = 0;
                activeExam.parts.forEach(part => {
                    part.questions.forEach(q => {
                        totalQ++;
                        const key = `${part.id}_${q.id}`;
                        const uAns = (userAnswers[key] || '').trim().toLowerCase();
                        const cAns = q.answer.trim().toLowerCase();
                        if (uAns === cAns) correctQ++;
                    });
                });

                const band = calculateBandScore(correctQ, totalQ);
                const newRecord = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('vi-VN'),
                    title: activeExam.title,
                    skill: activeExam.skill,
                    score: `${correctQ}/${totalQ}`,
                    band
                };
                setExamHistory(prev => [newRecord, ...prev]);
                showToast(`Đã nộp bài! Kết quả: ${correctQ}/${totalQ} (Band ~${band})`);
            };

            // Tính điểm hiện tại khi đã nộp bài
            const currentExamResult = useMemo(() => {
                if (!activeExam || !isSubmitted) return null;
                let total = 0;
                let correct = 0;
                activeExam.parts.forEach(part => {
                    part.questions.forEach(q => {
                        total++;
                        const key = `${part.id}_${q.id}`;
                        if ((userAnswers[key] || '').trim().toLowerCase() === q.answer.trim().toLowerCase()) {
                            correct++;
                        }
                    });
                });
                return { correct, total, band: calculateBandScore(correct, total) };
            }, [activeExam, isSubmitted, userAnswers]);

            // Lọc danh sách đề thi
            const filteredExams = useMemo(() => {
                return EXAM_DATABASE.filter(item => {
                    const matchSource = selectedSource === 'All' || item.source === selectedSource;
                    const matchSkill = selectedSkill === 'All' || item.skill === selectedSkill;
                    return matchSource && matchSkill;
                });
            }, [selectedSource, selectedSkill]);

            // Xử lý chấm bài AI Gemini (hoặc mô phỏng phân tích chuyên sâu nếu chưa nhập API key)
            const handleAiGrade = async () => {
                if (!aiUserResponse.trim() || aiUserResponse.trim().split(/\s+/).length < 15) {
                    showToast('Vui lòng nhập bài viết/câu trả lời ít nhất 15 từ để AI chấm điểm.');
                    return;
                }
                setIsGrading(true);
                setAiFeedback(null);

                if (geminiApiKey.trim()) {
                    try {
                        const prompt = `Bạn là giám khảo IELTS chuyên nghiệp. Hãy chấm điểm bài làm ${aiSkill} sau theo 4 tiêu chí chuẩn IELTS (Task Response/Fluency, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy), cho điểm Band cụ thể, chỉ ra lỗi sai và viết lại 1 đoạn nâng cấp Band 8.5+. Trả lời bằng tiếng Việt rõ ràng.\nĐề bài: ${aiPromptText}\nBài làm: ${aiUserResponse}`;
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey.trim()}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });
                        const data = await res.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            setAiFeedback({ isRealApi: true, content: text });
                            setIsGrading(false);
                            return;
                        }
                    } catch (err) {
                        showToast('Lỗi kết nối API Key, chuyển sang chế độ phân tích mẫu.');
                    }
                }

                // Chế độ phân tích tức thì tích hợp sẵn
                setTimeout(() => {
                    const wordCount = aiUserResponse.trim().split(/\s+/).length;
                    const estimatedBand = wordCount > 120 ? '7.0' : wordCount > 60 ? '6.5' : '6.0';
                    setAiFeedback({
                        isRealApi: false,
                        band: estimatedBand,
                        wordCount,
                        strengths: 'Bố cục câu rõ ràng, trả lời đúng trọng tâm câu hỏi và có sử dụng từ nối logic.',
                        improvements: 'Nên bổ sung thêm các cụm từ học thuật (Collocations) như "civic responsibility", "alleviate societal burdens" và dùng thêm câu phức nhượng bộ.',
                        sampleUpgrade: 'Compulsory community service not only fosters a profound sense of civic duty among adolescents, but also equips them with invaluable interpersonal skills prior to entering the workforce.'
                    });
                    setIsGrading(false);
                }, 900);
            };

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            // =====================================================================
            // GIAO DIỆN PHÒNG LÀM BÀI THỰC CHIẾN (ACTIVE EXAM VIEW)
            // =====================================================================
            if (activeExam) {
                const currentPart = activeExam.parts[fullTestPartIndex];
                return (
                    <div className="min-h-screen flex flex-col bg-slate-50">
                        {/* Sticky Exam Header */}
                        <header className="sticky top-0 z-30 bg-white border-b border-slate-200 px-3 sm:px-6 py-2.5 shadow-sm">
                            <div className="max-w-7xl mx-auto flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2 min-w-0">
                                    <button
                                        onClick={() => {
                                            window.speechSynthesis?.cancel();
                                            setActiveExam(null);
                                        }}
                                        className="p-2 rounded-xl hover:bg-slate-100 text-slate-600 transition flex-shrink-0"
                                        title="Thoát phòng thi"
                                    >
                                        <Icon name="arrow-left" className="w-5 h-5" />
                                    </button>
                                    <div className="truncate">
                                        <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-600 block">
                                            {activeExam.skill} Practice
                                        </span>
                                        <h1 className="text-sm sm:text-base font-bold text-slate-900 truncate">
                                            {activeExam.title}
                                        </h1>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                                    {!isSubmitted ? (
                                        <>
                                            <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-mono text-sm font-bold ${timeLeft < 180 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-slate-100 text-slate-800'}`}>
                                                <Icon name="clock" className="w-4 h-4" />
                                                <span>{formatTime(timeLeft)}</span>
                                            </div>
                                            <button
                                                onClick={handleSubmitExam}
                                                className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold px-3.5 sm:px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5"
                                            >
                                                <Icon name="check-circle" className="w-4 h-4" />
                                                <span>Nộp bài</span>
                                            </button>
                                        </>
                                    ) : (
                                        <div className="flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                                            <span className="text-xs font-medium text-emerald-700">Band:</span>
                                            <span className="text-base font-extrabold text-emerald-700">{currentExamResult?.band}</span>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Full Test Part Switcher */}
                            {isFullTestMode && (
                                <div className="max-w-7xl mx-auto mt-2 pt-2 border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar">
                                    {activeExam.parts.map((p, idx) => (
                                        <button
                                            key={p.id}
                                            onClick={() => {
                                                window.speechSynthesis?.cancel();
                                                setIsPlayingAudio(false);
                                                setFullTestPartIndex(idx);
                                            }}
                                            className={`px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition ${fullTestPartIndex === idx ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            {p.part}: {p.title.slice(0, 22)}...
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Mobile Pane Switcher (Bài đọc/Audio vs Câu hỏi) */}
                            <div className="lg:hidden mt-2 grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl">
                                <button
                                    onClick={() => setMobileExamPane('passage')}
                                    className={`py-1.5 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${mobileExamPane === 'passage' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}
                                >
                                    <Icon name={currentPart.skill === 'Reading' ? 'book-open' : 'headphones'} className="w-4 h-4" />
                                    <span>{currentPart.skill === 'Reading' ? 'Bài đọc (Passage)' : 'Audio & Transcript'}</span>
                                </button>
                                <button
                                    onClick={() => setMobileExamPane('questions')}
                                    className={`py-1.5 text-xs font-bold rounded-lg transition flex items-center justify-center gap-1.5 ${mobileExamPane === 'questions' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}
                                >
                                    <Icon name="list-checks" className="w-4 h-4" />
                                    <span>Câu hỏi ({currentPart.questions.length})</span>
                                </button>
                            </div>
                        </header>

                        {/* Result Summary Banner (Khi đã nộp bài) */}
                        {isSubmitted && currentExamResult && (
                            <div className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-4 py-4 shadow-inner">
                                <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold flex items-center gap-2">
                                            <Icon name="award" className="w-5 h-5 text-amber-300" />
                                            Hoàn thành bài thi! Đáp án & Giải thích chi tiết đã được mở khóa
                                        </h2>
                                        <p className="text-indigo-100 text-xs sm:text-sm mt-0.5">
                                            Bạn trả lời đúng <strong className="text-white">{currentExamResult.correct}/{currentExamResult.total}</strong> câu hỏi • Quy đổi tương đương <strong className="text-amber-300">IELTS Band {currentExamResult.band}</strong>
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setActiveExam(null)}
                                        className="bg-white text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition whitespace-nowrap"
                                    >
                                        Quay về Kho Đề Thi
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Main Split Screen Content */}
                        <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                            {/* Left Column: Passage or Listening Audio Player */}
                            <div className={`lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-sm overflow-y-auto max-h-[calc(100vh-150px)] ${mobileExamPane === 'passage' ? 'block' : 'hidden lg:block'}`}>
                                <div className="flex flex-wrap items-center gap-2 mb-3">
                                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100">
                                        {currentPart.source}
                                    </span>
                                    <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">
                                        {currentPart.level}
                                    </span>
                                </div>
                                <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 mb-1">
                                    {currentPart.title}
                                </h2>
                                <p className="text-xs sm:text-sm text-slate-500 italic mb-5 pb-4 border-b border-slate-100">
                                    {currentPart.subtitle}
                                </p>

                                {currentPart.skill === 'Reading' ? (
                                    <div className="space-y-4 academic-text text-[15px] sm:text-base text-slate-800">
                                        {currentPart.passage.map((para, index) => (
                                            <p key={index} className="leading-relaxed">
                                                <span className="inline-block font-sans text-xs font-bold text-indigo-500 mr-2 select-none">
                                                    [{String.fromCharCode(65 + index)}]
                                                </span>
                                                {para}
                                            </p>
                                        ))}
                                    </div>
                                ) : (
                                    /* Listening Audio Controls & Transcript */
                                    <div className="space-y-5">
                                        <div className="bg-slate-900 text-white rounded-2xl p-5 shadow-md">
                                            <div className="flex items-center justify-between gap-4">
                                                <div>
                                                    <span className="text-xs uppercase tracking-wider text-indigo-300 font-bold">
                                                        IELTS Listening Audio Simulator
                                                    </span>
                                                    <p className="text-sm text-slate-300 mt-1">
                                                        Giọng đọc hội thoại phân vai Nam / Nữ tự động
                                                    </p>
                                                </div>
                                                <button
                                                    onClick={() => togglePlayListeningAudio(currentPart.audioScript)}

                                                        }}
                                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                                                            isLearned ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                        }`}
                                                    >
                                                        {isLearned ? 'Đã thuộc ✓' : 'Đánh dấu thuộc'}
                                                    </button>
                                                </div>
                                                <p className="text-xs text-slate-600 italic mt-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                                    "{v.example}"
                                                </p>
                                                <div className="mt-3 flex items-center gap-2">
                                                    <button
                                                        onClick={() => speakWord(v.word, 'en-US')}
                                                        className="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center gap-1"
                                                    >
                                                        <Icon name="volume-2" className="w-3.5 h-3.5" /> US
                                                    </button>
                                                    <button
                                                        onClick={() => speakWord(v.word, 'en-GB')}
                                                        className="px-3 py-1.5 rounded-lg bg-violet-50 hover:bg-violet-100 text-violet-700 text-xs font-bold flex items-center gap-1"
                                                    >
                                                        <Icon name="volume-2" className="w-3.5 h-3.5" /> UK
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: NGỮ PHÁP & DÀN Ý WRITING / SPEAKING */}
                        {activeTab === 'grammar' && (
                            <div className="space-y-4">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <h2 className="text-lg font-extrabold text-slate-900">Ngữ Pháp Trọng Tâm & Dàn Ý Chuẩn Band 7.5+</h2>
                                    <p className="text-xs text-slate-500">Tổng hợp cấu trúc ăn điểm trong IELTS Writing và Speaking.</p>
                                </div>
                                <div className="space-y-4">
                                    {GRAMMAR_GUIDES.map((g, idx) => (
                                        <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
                                            <h3 className="font-extrabold text-base text-indigo-700">{g.title}</h3>
                                            <div className="p-3 rounded-xl bg-slate-900 text-emerald-300 font-mono text-xs overflow-x-auto">
                                                {g.formula}
                                            </div>
                                            <p className="text-sm text-slate-800">
                                                <strong>Ví dụ:</strong> <span className="italic">{g.example}</span>
                                            </p>
                                            <p className="text-xs text-slate-600 bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
                                                💡 <strong>Mẹo giám khảo:</strong> {g.tip}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 5: GIA SƯ AI GEMINI CHẤM WRITING & SPEAKING */}
                        {activeTab === 'ai' && (
                            <div className="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-5">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                                    <div>
                                        <h2 className="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                                            <Icon name="bot" className="w-6 h-6 text-indigo-600" />
                                            <span>Gia Sư AI Chấm Chữa Writing & Speaking</span>
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Nhận điểm Band ước tính, sửa lỗi ngữ pháp và gợi ý nâng cấp từ vựng học thuật.
                                        </p>
                                    </div>
                                    <input
                                        type="password"
                                        value={geminiApiKey}
                                        onChange={(e) => {
                                            setGeminiApiKey(e.target.value);
                                            localStorage.setItem('binhielts_api_key', e.target.value);
                                        }}
                                        placeholder="Nhập Gemini API Key (Tùy chọn)..."
                                        className="px-3 py-2 rounded-xl border border-slate-200 text-xs w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    {['Writing Task 1', 'Writing Task 2', 'Speaking Part 2 & 3'].map(sk => (
                                        <button
                                            key={sk}
                                            onClick={() => setAiSkill(sk)}
                                            className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition ${
                                                aiSkill === sk
                                                    ? 'bg-indigo-600 text-white border-indigo-600'
                                                    : 'bg-slate-50 text-slate-700 border-slate-200'
                                            }`}
                                        >
                                            {sk}
                                        </button>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">Đề bài (Prompt):</label>
                                        <textarea
                                            rows="2"
                                            value={aiPromptText}
                                            onChange={(e) => setAiPromptText(e.target.value)}
                                            className="w-full p-3 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">Bài làm của bạn:</label>
                                        <textarea
                                            rows="6"
                                            value={aiUserResponse}
                                            onChange={(e) => setAiUserResponse(e.target.value)}
                                            placeholder="Nhập bài viết hoặc nội dung câu trả lời Speaking của bạn tại đây..."
                                            className="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <button
                                        onClick={handleAiGrade}
                                        disabled={isGrading}
                                        className="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-sm transition flex items-center gap-2"
                                    >
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        <span>{isGrading ? 'AI đang chấm bài...' : 'Chấm điểm & Sửa bài chi tiết'}</span>
                                    </button>
                                </div>

                                {aiFeedback && (
                                    <div className="p-5 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3">
                                        {aiFeedback.isRealApi ? (
                                            <div className="whitespace-pre-wrap text-sm text-slate-800 leading-relaxed">
                                                {aiFeedback.content}
                                            </div>
                                        ) : (
                                            <>
                                                <div className="flex items-center justify-between">
                                                    <span className="font-extrabold text-indigo-900">Kết quả đánh giá chi tiết</span>
                                                    <span className="bg-indigo-600 text-white font-extrabold px-3 py-1 rounded-xl text-sm">
                                                        Estimated Band: {aiFeedback.band}
                                                    </span>
                                                </div>
                                                <p className="text-xs sm:text-sm text-slate-700">
                                                    <strong>Điểm mạnh:</strong> {aiFeedback.strengths}
                                                </p>
                                                <p className="text-xs sm:text-sm text-slate-700">
                                                    <strong>Cần cải thiện:</strong> {aiFeedback.improvements}
                                                </p>
                                                <div className="p-3.5 rounded-xl bg-white border border-indigo-100 text-xs sm:text-sm text-slate-800">
                                                    <strong className="text-indigo-700 block mb-1">Gợi ý viết lại chuẩn Band 8.5:</strong>
                                                    "{aiFeedback.sampleUpgrade}"
                                                </div>
                                            </>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Mobile Bottom Navigation Bar */}
                    <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 px-2 py-1.5 grid grid-cols-5 gap-1 shadow-lg">
                        {[
                            { id: 'dashboard', label: 'Lộ trình', icon: 'layout-dashboard' },
                            { id: 'practice', label: 'Luyện đề', icon: 'file-text' },
                            { id: 'vocab', label: 'Từ vựng', icon: 'book-a' },
                            { id: 'grammar', label: 'Ngữ pháp', icon: 'layers' },
                            { id: 'ai', label: 'Gia sư AI', icon: 'bot' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 text-[10px] font-bold transition ${
                                    activeTab === tab.id ? 'text-indigo-600 bg-indigo-50' : 'text-slate-500'
                                }`}
                            >
                                <Icon name={tab.icon} className="w-4 h-4" />
                                <span>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Placement Test Modal */}
                    {showPlacementModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 className="font-extrabold text-lg text-slate-900">Kiểm tra đầu vào nhanh</h3>
                                    <button onClick={() => setShowPlacementModal(false)} className="text-slate-400 hover:text-slate-700">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {PLACEMENT_QUESTIONS.map((item, idx) => (
                                        <div key={idx} className="space-y-2">
                                            <p className="text-xs sm:text-sm font-bold text-slate-800">{idx + 1}. {item.q}</p>
                                            <div className="grid grid-cols-1 gap-1.5">
                                                {item.options.map((opt, oIdx) => (
                                                    <button
                                                        key={oIdx}
                                                        onClick={() => setPlacementAnswers(prev => ({ ...prev, [idx]: oIdx }))}
                                                        className={`text-left px-3 py-2 rounded-xl text-xs border transition ${
                                                            placementAnswers[idx] === oIdx
                                                                ? 'bg-indigo-600 text-white border-indigo-600 font-bold'
                                                                : 'bg-slate-50 text-slate-700 border-slate-200'
                                                        }`}
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button
                                    onClick={() => {
                                        let score = 0;
                                        PLACEMENT_QUESTIONS.forEach((q, i) => {
                                            if (placementAnswers[i] === q.ans) score++;
                                        });
                                        const newLvl = score >= 4 ? 'Band 7.0+ (Mục tiêu 8.0+)' : score >= 2 ? 'Band 6.0 (Mục tiêu 7.5)' : 'Band 5.0 (Mục tiêu 6.5)';
                                        setUserLevel(newLvl);
                                        localStorage.setItem('binhielts_level', newLvl);
                                        setShowPlacementModal(false);
                                        showToast(`Đã cập nhật trình độ: ${newLvl}`);
                                    }}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm py-3 rounded-xl transition"
                                >
                                    Hoàn thành & Cập nhật lộ trình
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
